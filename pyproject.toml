[project]
name = "clipsnstrips"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "assemblyai",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-genai",
    "openai",
    "pydantic-settings",
    "tenacity",
    "typer",
    "yt-dlp",
]

[project.scripts]
clipsnstrips = "clipsnstrips.cli:app"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
